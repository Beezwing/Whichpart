name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    env:
      # A throwaway value so Prisma can generate its client / validate the
      # schema in CI. This is never a real database — no CI job connects
      # to production or staging.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run lint
